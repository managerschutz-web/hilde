name: HILDE Build

# Baut auf einem frischen Windows-Runner: UI (TypeScript) → .NET-Build → Tests → Publish →
# WiX-Installer → HILDE-Setup.exe + SHA-256-Prüfsummen als Artefakt.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      CI: true
      SIGN_CERT: ${{ secrets.HILDE_SIGN_CERT_BASE64 }}
      SIGN_PASS: ${{ secrets.HILDE_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version bestimmen
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $v = $Matches[1]; $release = 'true' }
          else { $v = "0.2.${{ github.run_number }}"; $release = 'false' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "HILDE $v (Freigabe: $release)"

      - name: Oberfläche kompilieren (TypeScript)
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.json

      - name: Restore
        run: dotnet restore Hilde.sln

      - name: Build
        run: dotnet build Hilde.sln -c Release --no-restore -p:HildeVersion=${{ steps.ver.outputs.version }}

      - name: Unit-Tests
        run: dotnet test tests/Unit/Hilde.Tests.Unit.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test-results

      - name: Windows-E2E-Tests (Einfügen in Notepad)
        continue-on-error: true
        run: dotnet test tests/WindowsE2E/Hilde.Tests.WindowsE2E.csproj -c Release --no-build --logger "trx;LogFileName=e2e.trx" --results-directory artifacts/test-results

      - name: Veröffentlichen (self-contained, win-x64)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish src/Hilde.EngineHost/Hilde.EngineHost.csproj -c Release -r win-x64 --self-contained -o artifacts/app -p:HildeVersion=$v
          dotnet publish src/Hilde.Desktop/Hilde.Desktop.csproj -c Release -r win-x64 --self-contained -o artifacts/app -p:HildeVersion=$v
          if (-not (Test-Path artifacts/app/HILDE.exe)) { throw "HILDE.exe fehlt" }
          if (-not (Test-Path artifacts/app/Hilde.Engine.exe)) { throw "Hilde.Engine.exe fehlt" }
          if (-not (Test-Path artifacts/app/ui/dist/main.js)) { throw "Oberfläche fehlt" }
          Get-ChildItem artifacts/app -Recurse -Include *.pdb | Remove-Item

      - name: Modellmanifest für Freigaben prüfen
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        run: ./scripts/check-manifest.ps1 -Strict

      - name: WebView2-Bootstrapper laden
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/Bundle/WebView2Bootstrapper.exe

      - name: Installer bauen (WiX)
        run: dotnet build installer/Bundle/Hilde.Bundle.wixproj -c Release -p:HildeVersion=${{ steps.ver.outputs.version }} -p:AppDir=${{ github.workspace }}\artifacts\app

      - name: Code-Signatur (optional)
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: ./scripts/sign.ps1 -Files (Get-ChildItem installer/Bundle/bin -Recurse -Filter HILDE-Setup.exe).FullName

      - name: Release-Artefakte und Prüfsummen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $setup = Get-ChildItem installer/Bundle/bin -Recurse -Filter HILDE-Setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName artifacts/release/HILDE-Setup-${{ steps.ver.outputs.version }}.exe
          Copy-Item models/manifest.json artifacts/release/models-manifest.json
          Get-ChildItem artifacts/release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content artifacts/release/SHA256SUMS.txt -Encoding utf8
          Get-Content artifacts/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HILDE-Setup-${{ steps.ver.outputs.version }}
          path: artifacts/release/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/

      - name: Interne Version unter „Releases“ bereitstellen (auch vom Handy ladbar)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item artifacts/release/HILDE-Setup-$v.exe artifacts/release/HILDE-Setup.exe
          gh release delete intern --yes --cleanup-tag 2>$null
          $notes = "Interner Build $v vom $(Get-Date -Format 'dd.MM.yyyy HH:mm') UTC – nicht zur Weitergabe.`n`nSHA-256:`n" + (Get-Content artifacts/release/SHA256SUMS.txt -Raw)
          gh release create intern artifacts/release/HILDE-Setup.exe artifacts/release/SHA256SUMS.txt `
            --title "HILDE intern $v" --notes $notes --prerelease --target ${{ github.sha }}

      - name: Interne Vorab-Version auf GitHub (Entwurf)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/release/*
